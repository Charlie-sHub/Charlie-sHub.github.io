name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Puro
        run: |
          dart pub global activate puro
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Create Puro environment
        run: puro create stable

      - name: Restore packages
        run: puro flutter pub get

      - name: Run code generation
        run: puro dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project
        run: puro flutter analyze

      - name: Run tests
        run: puro flutter test

      - name: Build Flutter Web release for root-hosted Pages
        run: puro flutter build web --release --base-href /

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
