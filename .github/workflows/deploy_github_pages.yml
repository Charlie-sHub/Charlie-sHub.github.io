name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PURO_ENV_NAME: portfolio_web
      FLUTTER_VERSION: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Puro
        env:
          PURO_VERSION: 1.5.0
        run: curl -o- https://puro.dev/install.sh | bash

      - name: Add Puro to PATH
        run: echo "$HOME/.puro/bin" >> "$GITHUB_PATH"

      - name: Verify Puro installation
        run: puro --version

      - name: Create Puro environment
        run: puro create "$PURO_ENV_NAME" "$FLUTTER_VERSION"

      - name: Verify Puro Flutter environment
        run: |
          puro --env="$PURO_ENV_NAME" --version
          puro --env="$PURO_ENV_NAME" flutter --version

      - name: Restore packages
        run: puro --env="$PURO_ENV_NAME" flutter pub get

      - name: Run code generation
        run: puro --env="$PURO_ENV_NAME" flutter pub run build_runner build

      - name: Analyze project
        run: puro --env="$PURO_ENV_NAME" flutter analyze

      - name: Run tests
        run: puro --env="$PURO_ENV_NAME" flutter test

      - name: Build Flutter Web release for root-hosted Pages
        run: puro --env="$PURO_ENV_NAME" flutter build web --release --base-href /

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
